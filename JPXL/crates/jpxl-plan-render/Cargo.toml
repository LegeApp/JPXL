[package]
name = "jpxl-plan-render"
description = "Encoder-side reconstruction of a validated VarDCT pixel plan to canonical RGB, without serializing or decoding a codestream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Peer-tree rule (AGENTS.md section 6): this crate never depends on
# `jpxl-decode`. It orchestrates the shared neutral kernels of `jpxl-core`
# over `jpxl-encode`'s plan types, and its parity against `jpxl-decode`,
# `djxl` and `jxl-oxide` is proved by tests, not by sharing code.
[dependencies]
# `simd` is named explicitly: plan rendering sits on the quality path's
# hottest loops, and without it a consumer that builds this crate outside the
# full workspace (where `jpxl-encode` happens to unify the feature back on)
# would silently get the scalar DCT kernels.
jpxl-core = { path = "../jpxl-core", version = "0.3.0", default-features = false, features = [
    "simd",
] }
jpxl-encode = { path = "../jpxl-encode", version = "0.3.0", default-features = false }

[dev-dependencies]
jpxl-decode.workspace = true
jpxl-encode-policy.workspace = true
# Path-only, deliberately: `jpxl-perceptual` optionally depends on this crate,
# so a versioned dev-dependency here would be a publish cycle crates.io cannot
# order. Cargo strips path-only dev-dependencies from the published manifest.
jpxl-perceptual = { path = "../jpxl-perceptual" }

[lints]
workspace = true
