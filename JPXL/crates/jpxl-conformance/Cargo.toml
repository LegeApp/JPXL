[package]
name = "jpxl-conformance"
description = "Conformance harness for the JPXL codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
jpxl-core.workspace = true
ssimulacra2 = { workspace = true, optional = true }
butteraugli = { workspace = true, optional = true }

[features]
default = []
# Perceptual scoring in `metrics`. Both off by default: these are the only
# third-party dependencies anywhere near this harness, and the exactness
# metrics (max_abs_error, peak_error_per_channel, rmse, psnr) that conformance
# actually grades on must never depend on them.
ssimulacra2 = ["dep:ssimulacra2"]
butteraugli = ["dep:butteraugli"]
# Both perceptual metrics at once — what the lossy RD harness wants.
perceptual = ["ssimulacra2", "butteraugli"]

[lints]
workspace = true
