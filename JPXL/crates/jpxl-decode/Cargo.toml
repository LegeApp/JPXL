[package]
name = "jpxl-decode"
description = "JPEG XL decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Forwards to jpxl-bitstream's field tracing, so a mis-parsed header can be
# localised to the bit at which it diverged.
trace = ["jpxl-bitstream/trace"]

[dependencies]
jpxl-bitstream.workspace = true
jpxl-core.workspace = true
jpxl-entropy.workspace = true

[dev-dependencies]
jpxl-conformance.workspace = true

[lints]
workspace = true
