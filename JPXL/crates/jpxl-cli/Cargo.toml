[package]
name = "jpxl-cli"
description = "Command-line front end for the JPXL codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "jpxl"
path = "src/main.rs"

[dependencies]
image.workspace = true
jpxl = { path = "../jpxl", version = "0.3.0", default-features = false }
jpxl-bitstream.workspace = true
jpxl-core = { workspace = true }
jpxl-decode.workspace = true
jpxl-encode = { workspace = true }
jpxl-encode-policy = { workspace = true }
jpxl-conformance.workspace = true
jpxl-perceptual.workspace = true

[features]
default = ["parallel", "simd"]
parallel = ["jpxl-encode/parallel", "jpxl-encode-policy/parallel"]
simd = ["jpxl-encode/simd", "jpxl-encode-policy/simd", "jpxl-core/simd"]
# Compatibility feature for explicitly forwarding Fast rate-preset support.
# Policy enables it normally; Quality remains the runtime default.
anchor-sketch = ["jpxl-encode-policy/anchor-sketch"]
# One-shot program PR 5: forwards the policy crate's feature-gated
# common-case one-shot start to the binary, for promotion A/B runs.
one-shot-controller = ["jpxl-encode-policy/one-shot-controller"]
surrogate-navigation = ["jpxl-encode-policy/surrogate-navigation"]
# Contract B trial candidates (2026-09-02), forwarded for promotion A/B runs.
trusted-first-probe = ["jpxl-encode-policy/trusted-first-probe"]
corrected-stop = ["jpxl-encode-policy/corrected-stop"]
flagged-median-start = ["jpxl-encode-policy/flagged-median-start"]
# Exposes the exhaustive-reference `quality` lossy effort on `--effort` /
# `--lossy-preset`. Forwards to `jpxl/quality-effort`; off by default.
quality-effort = ["jpxl/quality-effort"]
# `jpxl compare` also reports SSIMULACRA2. Off by default so the shipped CLI
# keeps this workspace's near-zero dependency footprint; build with
# `--features ssimulacra2` when grading lossy encodes.
ssimulacra2 = ["jpxl-conformance/ssimulacra2"]
butteraugli = ["jpxl-conformance/butteraugli"]
# Both perceptual metrics — what the lossy RD harness builds with.
perceptual = ["ssimulacra2", "butteraugli"]

[lints]
workspace = true
