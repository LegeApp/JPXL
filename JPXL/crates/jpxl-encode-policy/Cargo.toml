[package]
name = "jpxl-encode-policy"
description = "JPEG XL encoder policy: analysis, search and rate-distortion decisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# One-way boundary: policy depends on the normative encoder for its plan types.
# `jpxl-encode` must never gain a dependency on this crate — that direction is
# what keeps heuristics out of the writer (docs/Encoder-plan1.md §1).
[dependencies]
jpxl-core = { workspace = true }
jpxl-encode = { workspace = true }
# Slice 18: the entropy trainer tokenizes census values with the exact C.2.3
# hybrid-uint arithmetic the writer will use. In-workspace, same clean-room
# boundary; the one-way policy/encoder edge above is unaffected.
jpxl-entropy.workspace = true
wide = { workspace = true, optional = true }

[features]
default = [
    "parallel",
    "simd",
    "anchor-sketch",
    "g5-bounded-entropy",
    "one-shot-controller",
    "corrected-stop",
    "flagged-median-start",
    "reserve-coupled-band",
]
parallel = ["jpxl-encode/parallel"]
# Leaf SIMD for HF quantize choose (and transitive DCT/Gaborish).
simd = ["dep:wide", "jpxl-encode/simd", "jpxl-core/simd"]
# Fast runtime rate preset: bounded two-anchor prediction and exact finalist
# verification. The exhaustive Quality preset remains the behavioral default.
# Keep the historical feature name so existing research scripts still work.
anchor-sketch = []
# G5: retain the legacy hybrid-uint configuration and add only the cheapest
# alternative ranked from the near-target anchor and finalist censuses. The
# feature remains explicit as a byte-identical-off control after promotion.
g5-bounded-entropy = []
# One-shot program PR 5: the common-case one-shot start — the generated
# crossing model's risk-adjusted candidate (or, when uncertain, its median)
# becomes the first fresh plan and its slope prior steers the first
# correction, with the exact navigator continuing under the same total caps
# and canonical verification before every emission. Default since the
# 2026-08-24 promotion A/B: zero floor violations on 441 never-tuned
# holdout cells, byte geomean 0.997/0.990 vs the previous default, and
# fewer reconstructions. Build without default features for the legacy
# table-seeded controller.
one-shot-controller = []
# Phase S1: half-resolution surrogate bracket search with canonical
# confirmation. Off by default until the promotion A/B gate passes.
surrogate-navigation = []
# Contract B navigator levers (2026-09-02, @jpegxl-rs.question.one-shot-calibration-contract-b):
# three feature-gated quality-policy changes, each of which can change which
# rung wins and therefore the emitted bytes. `corrected-stop` (which implies
# `trusted-first-probe`) and `flagged-median-start` are in `default` since the
# operator's 2026-09-02 promotion decision, on the one_shot_promotion_ab.py
# corpus gate recorded in docs/experiments/2026-09-02-contract-b-corrected-stop-trial.md
# (0 floor violations on 91 q85 and 140 seven-target holdout cells, byte
# geomean 0.995, 3.46 -> 3.02 pixel probes per encode, levers additive).
# Build without default features for the pre-promotion controller.
#
# `trusted-first-probe`: a first canonical probe that lands feasible inside
# the accept band ends navigation there whatever the crossing model's
# confidence said (the N3 stop without its confidence gate).
trusted-first-probe = []
# `corrected-stop`: after a first probe outside the band, one direct
# correction aimed at the crossing from the measured loss with the prior
# exponent (only when the implied move is at most CORRECTED_STOP_MOVE_GATE
# in ln scale), then one slope-corrected second try; a probe that lands
# in band ends navigation, anything else hands over to the unchanged
# bracket expansion. Implies `trusted-first-probe`.
corrected-stop = ["trusted-first-probe"]
# `flagged-median-start`: a frame whose only out-of-distribution signal is
# being larger than the training domain seeds the navigator with the
# model's median rung instead of the legacy table start.
flagged-median-start = []
# `reserve-coupled-band`: the accept band is MET_BAND_RESERVE_MULTIPLE times
# the effort's loss-relative reserve margin (never narrower than
# MET_OVERSHOOT_BAND), so the crossing aim always lies inside the band that
# stops the search. Identical bytes wherever the reserve margin is under one
# point (Balanced at 85 and above); changes which rung wins below that. In
# `default` since the 2026-09-02 delegated decision
# (@jpegxl-rs.decision.promote-reserve-coupled-band-2026-09-02), measured in
# docs/experiments/2026-09-02-reserve-coupled-band-trial.md: 0 floor
# violations on 635 cells, Balanced low-target probes 3.91 -> 3.41 for byte
# geomean 1.005, Fast 2.65 -> 2.16 for 1.010, 85+ byte-identical.
reserve-coupled-band = []
# `case-predictor`: the first-guess crossing comes from the generated case
# table (src/quality_predictor_cases.rs: the labelled corpus images'
# standardized features and oracle crossing curves) as the distance-weighted
# mean of the nearest cases' curves, instead of the linear knot model.
# Off by default pending the 2026-09-02 blind holdout trial.
case-predictor = []
# S8 Phase D (AKR source `outside-advice-2026-08-06` §8;
# `jpegxl-rs.work.arch-s8-full-redesign-scoped`):
# the Phase C-validated (zero safety violations, exhaustively checked)
# staged cheap lower-bound prune in `block_cost_bounded`. NOT in `default` —
# with this feature off, `block_cost_bounded` compiles byte-identical to
# before Phase D; the flag exists so the prune can be measured against real
# corpora without committing to it as the shipped behavior yet.
s8-cover-prune = []

# Peer oracles, tests only. `jpxl-decode` must never appear in [dependencies]:
# an encoder bug its paired decoder happens to accept would prove itself
# correct. `tests/boundary.rs` enforces exactly that distinction.
[dev-dependencies]
jpxl-conformance.workspace = true
jpxl-decode.workspace = true

[lints]
workspace = true
