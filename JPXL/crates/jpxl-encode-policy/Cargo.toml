[package]
name = "jpxl-encode-policy"
description = "JPEG XL encoder policy: analysis, search and rate-distortion decisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# One-way boundary: policy depends on the normative encoder for its plan types.
# `jpxl-encode` must never gain a dependency on this crate — that direction is
# what keeps heuristics out of the writer (docs/Encoder-plan1.md §1).
[dependencies]
jpxl-core.workspace = true
jpxl-encode.workspace = true
# Slice 18: the entropy trainer tokenizes census values with the exact C.2.3
# hybrid-uint arithmetic the writer will use. In-workspace, same clean-room
# boundary; the one-way policy/encoder edge above is unaffected.
jpxl-entropy.workspace = true

# Peer oracles, tests only. `jpxl-decode` must never appear in [dependencies]:
# an encoder bug its paired decoder happens to accept would prove itself
# correct. `tests/boundary.rs` enforces exactly that distinction.
[dev-dependencies]
jpxl-conformance.workspace = true
jpxl-decode.workspace = true

[lints]
workspace = true
