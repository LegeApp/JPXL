[workspace]
resolver = "3"
members = [
    "crates/jpxl",
    "crates/jpxl-bitstream",
    "crates/jpxl-core",
    "crates/jpxl-entropy",
    "crates/jpxl-jpeg",
    "crates/jpxl-decode",
    "crates/jpxl-encode",
    "crates/jpxl-encode-policy",
    "crates/jpxl-cli",
    "crates/jpxl-conformance",
    "crates/jpxl-perceptual",
    "crates/jpxl-plan-render",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/LegeApp/JPXL"
homepage = "https://github.com/LegeApp/JPXL"
keywords = ["jpeg-xl", "jxl", "image", "codec", "compression"]
categories = ["multimedia::images", "encoding", "compression"]

# In-workspace crates plus Opt-P leaf deps (feature-gated; default-on).
[workspace.dependencies]
jpxl-bitstream = { path = "crates/jpxl-bitstream", version = "0.3.0" }
jpxl-core = { path = "crates/jpxl-core", version = "0.3.0" }
jpxl-entropy = { path = "crates/jpxl-entropy", version = "0.3.0" }
jpxl-decode = { path = "crates/jpxl-decode", version = "0.3.0" }
jpxl-encode = { path = "crates/jpxl-encode", version = "0.3.0" }
jpxl-encode-policy = { path = "crates/jpxl-encode-policy", version = "0.3.0" }
jpxl-conformance = { path = "crates/jpxl-conformance", version = "0.3.0" }
jpxl = { path = "crates/jpxl", version = "0.3.0" }
jpxl-perceptual = { path = "crates/jpxl-perceptual", version = "0.3.0" }
jpxl-plan-render = { path = "crates/jpxl-plan-render", version = "0.3.0" }
# Coarse group/section parallelism (EncodeResources ordered_map).
rayon = "1.10"
# Portable SIMD for leaf kernels (DCT butterflies, Gaborish, quantize).
wide = "0.7"
# SSIMULACRA2 perceptual metric (BSD-2-Clause), for grading lossy encodes
# against the oracle. MEASUREMENT ONLY, and off by default: it is an optional
# dependency of the jpxl-conformance harness behind its `ssimulacra2` feature,
# reachable from `jpxl compare --ssimulacra2`. No normative crate depends on
# it, and a default `cargo build --workspace` does not fetch it. It pulls
# yuvxyb/thiserror/num-traits, which is why it stays opt-in: AGENTS.md §6 bans
# `thiserror` from this project's own error types, and that ban is not a
# licence to smuggle it in transitively on the default path.
ssimulacra2 = "0.5.1"
# Butteraugli perceptual metric (BSD-3-Clause, pure Rust, no C deps), the
# metric `cjxl -d` targets — so it is the only way to grade a lossy encode on
# the axis the oracle is actually optimising. Same terms as ssimulacra2 above:
# MEASUREMENT ONLY, off by default, optional dependency of jpxl-conformance.
#
# Clean-room note (AGENTS.md §2): this crate is a *port of libjxl's*
# butteraugli. Permissive licence, and grading output is the same category as
# running cjxl/djxl as oracles, so using it as a metric is fine. Wiring it into
# the encoder's own rate control would be a different decision — it would make
# our perceptual model a derivative of libjxl's rather than our own — and needs
# recording as such before anyone does it.
butteraugli = "0.9"
# End-user raster-file adapters. This is used only by jpxl-cli; the public
# jpxl facade and all normative codec crates remain pixel-buffer based.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"

[profile.release]
debug = true
lto = "thin"
codegen-units = 1

# The shipping profile: `release` plus full (fat) LTO. Build it through
# `tools/build-release-final.sh`, which wraps it in the measured PGO cycle
# (instrument → train on the canonical test-set images → rebuild with the
# profile). Re-measured 2026-08-26, the fat-LTO + PGO cycle gains 2-8% over
# the thin-LTO `release` profile; the -36.65%/-53.48% Phase 8.5 figures are
# historical and predate the Opt-F..P rounds. `release` (thin LTO) remains
# the profile for benchmarks and promoted timings so historical numbers stay
# comparable.
[profile.release-final]
inherits = "release"
lto = "fat"

# Optimised like `release` but built for iteration speed: no LTO, sixteen
# codegen units, incremental, and with debug assertions and overflow checks
# kept ON so the `debug_assert!` shape guards in the codec still fire under
# test. Use it for the edit/build/test loop (`cargo test --profile fast-debug`,
# `cargo build --profile fast-debug`); use `release` for benchmarks, perf
# profiles, promoted timings and shipped binaries. Output lands in
# `target/fast-debug/`.
[profile.fast-debug]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
